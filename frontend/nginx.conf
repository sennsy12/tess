server {
    listen 80;
    server_name localhost;

    # ── Compression ──────────────────────────────────────────────────────────
    # nginx:alpine ships with gzip disabled, so the SPA bundle was previously
    # served uncompressed. Enabling it typically cuts JS/CSS transfer by
    # ~65-70% (the entry chunk alone is ~358 KB raw / ~100 KB gzipped).
    # `gzip_vary` is required so caches key on Accept-Encoding.
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        text/plain
        text/css
        text/xml
        application/javascript
        application/json
        application/xml
        application/manifest+json
        image/svg+xml
        font/woff2;

    # ── Vite content-hashed assets ───────────────────────────────────────────
    # Filenames include a content hash, so a changed file is always a new URL.
    # Safe to cache for a year with zero invalidation risk.
    location /assets/ {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # ── SPA shell ────────────────────────────────────────────────────────────
    # index.html references the hashed assets, so it must always be
    # revalidated — a cached shell would pin an obsolete asset manifest.
    # `try_files` and the `index` directive both internally redirect here, so
    # deep links (/kunde/orders) inherit this policy too.
    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache";
    }

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
